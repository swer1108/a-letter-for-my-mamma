

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter for My Mamma 💜</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="book">

        <section class="book-cover" id="bookCover">
            <div class="cover-border">

                <p class="cover-small">A LETTER FROM MY HEART</p>

                <div class="cover-heart">♥</div>

                <h1>For My<br>Mamma</h1>

                <div class="cover-divider"></div>

                <p class="cover-subtitle">
                    Words I wish I could whisper
                </p>

                <p class="cover-date">Love Always</p>

                <button class="open-book" id="openBook">
                    Open my letter, Mamma 💜
                </button>

            </div>
        </section>

        <section class="letter-page" id="letterPage" hidden>

            <p class="letter-heading">A little letter for you</p>

            <h2>My Mamma 💜</h2>

            <div class="letter-divider"></div>

            <p class="letter-placeholder">
                Your letter will live here, mamma.
            </p>

        </section>

    </main>

    </main>

    <script>
        const openBook = document.getElementById("openBook");
        const bookCover = document.getElementById("bookCover");
        const letterPage = document.getElementById("letterPage");

        openBook.addEventListener("click", function () {
            bookCover.hidden = true;
            letterPage.hidden = false;
        });
    </script>

</body>
</html>

</body>
</html>
